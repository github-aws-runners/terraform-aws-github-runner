name: "Smoke Tests"

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "lambdas/**"
      - "tests/ministack/**"
      - "tests/multi-runner-orchestration/**"
      - ".github/workflows/smoke-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ministack_smoke:
    name: Run webhook and scale-set smoke tests against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and run MiniStack smoke tests
        run: |
          compose_file=tests/multi-runner-orchestration/docker-compose.yml
          docker compose -f "$compose_file" build
          docker compose -f "$compose_file" run --no-TTY --rm smoke-tests

      - name: Stop MiniStack Compose services
        if: always()
        run: docker compose -f tests/multi-runner-orchestration/docker-compose.yml down --remove-orphans
