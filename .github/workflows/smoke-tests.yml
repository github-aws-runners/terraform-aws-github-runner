name: "Smoke Tests"

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "lambdas/**"
      - "tests/ministack/**"
      - "tests/multi-runner-orchestration/**"
      - ".github/workflows/smoke-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ministack_smoke:
    name: Run webhook and scale-set smoke tests against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Compose Build and Run
        run: |
          compose_file=tests/multi-runner-orchestration/docker-compose.yml
          docker compose --parallel 1 -f "$compose_file" pull
          docker compose --parallel 1 -f "$compose_file" build
          docker compose --parallel 1 -f "$compose_file" run --no-TTY --rm smoke-tests

      - name: Print MiniStack logs on failure
        if: failure()
        run: docker compose -f tests/multi-runner-orchestration/docker-compose.yml logs --no-color --timestamps --tail=all ministack || true
