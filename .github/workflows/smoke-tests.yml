name: "Smoke Tests"

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "images/microvm-ubuntu/**"
      - "lambdas/**"
      - "tests/ministack/**"
      - ".github/workflows/smoke-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: "000000000000"
  AWS_DEFAULT_REGION: eu-west-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_REGION: eu-west-1
  AWS_SECRET_ACCESS_KEY: test-only
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  control_plane_smoke:
    name: Run webhook and pool lifecycle smoke test against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      ministack:
        image: ghcr.io/ministackorg/ministack:1.5.16@sha256:9813da34285a0760477c761c1c03717e0290d259213c0ca97f551fefd87b292d
        ports:
          - 4566:4566
        options: --add-host=host.docker.internal:host-gateway
        env:
          MINISTACK_ACCOUNT_ID: "000000000000"
          MINISTACK_REGION: eu-west-1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: lambdas/.nvmrc
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Build Lambda distributions for smoke tests
        run: |
          ./.ci/build.sh

      - name: Start MockServer
        id: mockserver
        uses: mock-server/setup-mockserver@24612c2ccef1f83d587f331ed77cc5cef441e0b1 # v1.0.0
        with:
          version: '7.6.0@sha256:80b3b1a26f3553d0c81a3f3896b5b7274c17b2a2e52f0fd2b28e246bc9efa290'
          port: '1080'
          startup-timeout: '60'

      - name: Install boto3
        run: python3 -m pip install --upgrade boto3 botocore

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Run webhook and pool lifecycle smoke test
        env:
          MINISTACK_GITHUB_MOCK_HOST: host.docker.internal
          MINISTACK_GITHUB_MOCK_PORT: "1080"
          MINISTACK_GITHUB_MOCK_URL: ${{ steps.mockserver.outputs.url }}
        run: python3 tests/ministack/run-webhook-smoke.py

      - name: Upload MiniStack smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ministack-smoke-diagnostics
          path: |
            ministack-smoke.log
            ministack-smoke-checklist.txt
          if-no-files-found: warn
          retention-days: 7

  scale_set_smoke:
    name: Run scale set lifecycle smoke test against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ministack:
        image: ghcr.io/ministackorg/ministack:1.5.16@sha256:9813da34285a0760477c761c1c03717e0290d259213c0ca97f551fefd87b292d
        ports:
          - 4566:4566
        # MiniStack launches nested service containers for the integration smoke test.
        # This digest-pinned, non-fork workflow is the narrowly scoped Docker-daemon exception.
        options: >-
          --add-host=host.docker.internal:host-gateway
          --volume /var/run/docker.sock:/var/run/docker.sock
        env:
          MINISTACK_ACCOUNT_ID: "000000000000"
          MINISTACK_REGION: eu-west-1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: lambdas/.nvmrc
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Build Lambda distributions for smoke tests
        run: |
          ./.ci/build.sh

      - name: Start MockServer
        id: mockserver
        uses: mock-server/setup-mockserver@24612c2ccef1f83d587f331ed77cc5cef441e0b1 # v1.0.0
        with:
          version: '7.6.0@sha256:80b3b1a26f3553d0c81a3f3896b5b7274c17b2a2e52f0fd2b28e246bc9efa290'
          port: '1080'
          startup-timeout: '60'

      - name: Install boto3
        run: python3 -m pip install --upgrade boto3 botocore

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Run scale-set ECS/MockServer smoke test
        env:
          MINISTACK_GITHUB_MOCK_HOST: mockserver
          MINISTACK_GITHUB_MOCK_PORT: "1080"
          MINISTACK_GITHUB_MOCK_URL: ${{ steps.mockserver.outputs.url }}
        run: python3 tests/ministack/run-scale-set-smoke.py
