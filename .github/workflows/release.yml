name: Release build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # for reading repository contents

jobs:
  validate:
    name: Validate Lambda packages
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and run tests
        working-directory: lambdas
        run: yarn install --frozen-lockfile && yarn run test

  release:
    name: Create release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # for release-please-action to create releases and update changelogs
      pull-requests: write # for release-please-action to create and update pull requests
      issues: write # for release-please-action to create and update issues
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          release-type: terraform-module
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and publish release artifacts
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # for uploading release assets and updating release notes
      actions: write # for triggering workflows
      id-token: write # for generating attestations
      attestations: write # for writing attestations
      artifact-metadata: write # for publishing linked container attestations
      packages: write # for publishing the scale-set service image to GHCR
    env:
      SCALE_SET_IMAGE: ghcr.io/${{ github.repository_owner }}/terraform-aws-github-runner-scale-set-service
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build Lambda packages
        working-directory: lambdas
        run: yarn install --frozen-lockfile && yarn dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish scale-set service image
        id: scale-set-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./lambdas/services/scale-set/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SCALE_SET_IMAGE }}:${{ env.TAG_NAME }}
            ${{ env.SCALE_SET_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG_NAME }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=scale-set-service
          cache-to: type=gha,mode=max,scope=scale-set-service

      - name: Attest scale-set service image
        id: scale-set-image-attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.SCALE_SET_IMAGE }}
          subject-digest: ${{ steps.scale-set-image.outputs.digest }}
          push-to-registry: true

      - name: Attest Lambda packages
        id: lambda-attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '${{ github.workspace }}/lambdas/functions/**/*.zip'

      - name: Update release notes with attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_URL: ${{ steps.lambda-attest.outputs.attestation-url }}
          CONTAINER_ATTESTATION_URL: ${{ steps.scale-set-image-attest.outputs.attestation-url }}
          CONTAINER_DIGEST: ${{ steps.scale-set-image.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$TAG_NAME" --json body --jq '.body' > release-notes.md
          printf '\n## Attestation\n\nArtifact attestation: %s\n\nVerify artifacts with `gh attestation verify <artifact> --repo %s`.\n\nScale-set service image: `%s@%s`\n\nContainer attestation: %s\n' \
            "$ATTESTATION_URL" \
            "$REPOSITORY" \
            "$SCALE_SET_IMAGE" \
            "$CONTAINER_DIGEST" \
            "$CONTAINER_ATTESTATION_URL" >> release-notes.md
          gh release edit "$TAG_NAME" --notes-file release-notes.md --title "$TAG_NAME"

      - name: Upload Lambda release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r -d '' file; do
            gh release upload "$TAG_NAME" "$file"
          done < <(find . -type f -name '*.zip' -print0)

      - name: Attach Lambda attestation bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_BUNDLE: ${{ steps.lambda-attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.lambda-attest.outputs.attestation-id }}
        run: |
          if [[ ! -s "$ATTESTATION_BUNDLE" ]]; then
            echo "::error::Lambda attestation bundle is missing or empty"
            exit 1
          fi

          SIGSTORE_BUNDLE="$RUNNER_TEMP/github-aws-runners-terraform-aws-github-runner-attestation-${ATTESTATION_ID}.sigstore"
          INTOTO_BUNDLE="$RUNNER_TEMP/github-aws-runners-terraform-aws-github-runner-attestation-${ATTESTATION_ID}.intoto.jsonl"
          mv -- "$ATTESTATION_BUNDLE" "$SIGSTORE_BUNDLE"

          jq -er '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json").payload' "$SIGSTORE_BUNDLE" \
            | base64 --decode \
            | jq . > "$INTOTO_BUNDLE"

          gh release upload "$TAG_NAME" "$SIGSTORE_BUNDLE"
          gh release upload "$TAG_NAME" "$INTOTO_BUNDLE"
