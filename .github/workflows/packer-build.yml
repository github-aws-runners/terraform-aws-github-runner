name: "Packer checks"
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/packer-build.yml"
      - "module/runners/templates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  discover_packer_examples:
    name: Discover Packer examples
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.discover.outputs.images }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Discover Packer template directories
        id: discover
        shell: bash
        run: |
          mapfile -t images < <(
            find images \
              \( -type d \( -name .git -o -name .terraform \) -prune \) -o \
              \( -type f \( -name '*.pkr.hcl' -o -name '*.pkr.json' \) -print \) |
            while IFS= read -r template; do
              dirname "${template}"
            done |
            sed 's#^images/##' |
            sort -u
          )

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No Packer examples found under images/"
            exit 1
          fi

          images_json="$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${images[@]}")"
          printf 'images=%s\n' "${images_json}" >> "${GITHUB_OUTPUT}"

  verify_packer:
    name: Verify packer (${{ matrix.image }})
    needs: discover_packer_examples
    runs-on: ubuntu-latest
    container:
      image: index.docker.io/hashicorp/packer@sha256:12c441b8a3994e7df9f0e2692d9298f14c387e70bcc06139420977dbf80a137b # 1.11.2
    strategy:
      matrix:
        image: ${{ fromJSON(needs.discover_packer_examples.outputs.images) }}
    defaults:
      run:
        working-directory: images/${{ matrix.image }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: packer init
        run: packer init .
      - name: check packer formatting
        run: packer fmt -recursive -check=true .
      - name: packer validate
        run: packer validate -evaluate-datasources .
