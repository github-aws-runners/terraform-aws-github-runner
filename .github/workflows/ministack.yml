name: "MiniStack Terraform lifecycle"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ministack.yml"
      - "tests/ministack/**"
      - "*.tf"
      - "policies/**"
      - "examples/**"
      - "modules/**"
  pull_request:
    paths:
      - ".github/workflows/ministack.yml"
      - "tests/ministack/**"
      - "*.tf"
      - "policies/**"
      - "examples/**"
      - "modules/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: "000000000000"
  AWS_DEFAULT_REGION: eu-west-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ENDPOINT_URL: http://127.0.0.1:4566
  AWS_REGION: eu-west-1
  AWS_SECRET_ACCESS_KEY: test-only
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform_lifecycle:
    name: Apply/destroy ${{ matrix.example }} against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        example:
          - base
          - default
          - ephemeral
          - multi-runner
          - prebuilt
          - termination-watcher
    services:
      ministack:
        image: ghcr.io/ministackorg/ministack:1.5.0@sha256:ba48c20747780605a4287a950e7bb1758ddc3b55ec92409a0c47677cbe26bbb9
        ports:
          - 4566:4566
        env:
          MINISTACK_ACCOUNT_ID: "000000000000"
          MINISTACK_REGION: eu-west-1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Mark repository as safe
        shell: sh
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: init
        name: Terraform init
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh init "$EXAMPLE"

      - id: apply
        name: Terraform apply
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh apply "$EXAMPLE"

      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success'
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh destroy "$EXAMPLE"
