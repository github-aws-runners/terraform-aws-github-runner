name: "MiniStack Terraform lifecycle"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ministack.yml"
      - "tests/ministack/**"
      - "*.tf"
      - "policies/**"
      - "examples/**"
      - "modules/**"
      - "lambdas/**"
  pull_request:
    paths:
      - ".github/workflows/ministack.yml"
      - "tests/ministack/**"
      - "*.tf"
      - "policies/**"
      - "examples/**"
      - "modules/**"
      - "lambdas/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: "000000000000"
  AWS_DEFAULT_REGION: eu-west-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ENDPOINT_URL: http://127.0.0.1:4566
  AWS_REGION: eu-west-1
  AWS_SECRET_ACCESS_KEY: test-only
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform_lifecycle:
    name: Apply/destroy ${{ matrix.example }} against MiniStack (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        example:
          - base
          - prebuilt
          - default
          - ephemeral
          - multi-runner
          - termination-watcher
        terraform:
          - "1.4.0"
          - latest
    services:
      ministack:
        image: ghcr.io/ministackorg/ministack:1.5.7@sha256:37361b9ef886463d5632d5a4b2d114da4b7a5c5793f52f07dbc72579f2fd9207
        ports:
          - 4566:4566
        env:
          MINISTACK_ACCOUNT_ID: "000000000000"
          MINISTACK_REGION: eu-west-1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Mark repository as safe
        shell: sh
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: init
        name: Terraform init
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh init "$EXAMPLE"

      - id: apply
        name: Terraform apply
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh apply "$EXAMPLE"

      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success'
        env:
          EXAMPLE: ${{ matrix.example }}
        run: tests/ministack/run-example.sh destroy "$EXAMPLE"

  integration_smoke:
    name: Run webhook and pool lifecycle smoke test against MiniStack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      ministack:
        image: ghcr.io/ministackorg/ministack:1.5.7@sha256:37361b9ef886463d5632d5a4b2d114da4b7a5c5793f52f07dbc72579f2fd9207
        ports:
          - 4566:4566
        options: --add-host=host.docker.internal:host-gateway
        env:
          MINISTACK_ACCOUNT_ID: "000000000000"
          MINISTACK_REGION: eu-west-1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: lambdas/.nvmrc
          package-manager-cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Install Lambda dependencies
        working-directory: lambdas
        run: yarn install --frozen-lockfile

      - name: Build smoke-test Lambda distributions
        working-directory: lambdas
        run: |
          yarn workspace @aws-github-runner/webhook dist
          yarn workspace @aws-github-runner/control-plane dist

      - name: Start MockServer
        id: mockserver
        uses: mock-server/setup-mockserver@24612c2ccef1f83d587f331ed77cc5cef441e0b1 # v1.0.0
        with:
          version: '7.6.0@sha256:80b3b1a26f3553d0c81a3f3896b5b7274c17b2a2e52f0fd2b28e246bc9efa290'
          port: '1080'
          startup-timeout: '60'

      - name: Run webhook and pool lifecycle smoke test
        env:
          MINISTACK_GITHUB_MOCK_HOST: host.docker.internal
          MINISTACK_GITHUB_MOCK_PORT: "1080"
          MINISTACK_GITHUB_MOCK_URL: ${{ steps.mockserver.outputs.url }}
        run: sh tests/ministack/run-smoke.sh
