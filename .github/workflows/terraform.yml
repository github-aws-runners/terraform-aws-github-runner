name: "Terraform checks"
on:
  push:
    branches:
      - main
  pull_request:
    paths: ["**/*.tf", "**/*.hcl", ".github/workflows/terraform.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
jobs:
  verify_module:
    name: Verify root module (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform-1.5.6
            version: "1.5.6"
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: terraform-latest
            version: latest
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: tofu-1.11
            version: "1.11"
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
          - name: tofu-latest
            version: latest
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: "Fake zip files" # Validate will fail if it cannot find the zip files
        run: |
          touch lambdas/functions/webhook/webhook.zip
          touch lambdas/functions/control-plane/runners.zip
          touch lambdas/functions/gh-agent-syncer/runner-binaries-syncer.zip
          touch lambdas/functions/ami-housekeeper/ami-housekeeper.zip
          touch lambdas/functions/termination-watcher/termination-watcher.zip

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND validate

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl
          tflint -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars

  verify_modules:
    name: Verify module ${{ matrix.module }} (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform-1.5.6
            version: "1.5.6"
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: terraform-latest
            version: latest
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: tofu-1.11
            version: "1.11"
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
          - name: tofu-latest
            version: latest
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
        module:
          - ami-housekeeper
          - download-lambda
          - lambda
          - multi-runner
          - modules/compute-providers/aws/microvm
          - modules/compute-providers/aws/microvm/trust-policy
          - runner-binaries-syncer
          - runners
          - setup-iam-permissions
          - ssm
          - termination-watcher
          - webhook
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND validate

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        working-directory: ${{ github.workspace }}
        env:
          MODULE_NAME: ${{ matrix.module }}
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl --chdir "modules/${MODULE_NAME}"
          tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "modules/${MODULE_NAME}"

  verify_examples:
    name: Verify example ${{ matrix.example }} (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform-1.5.6
            version: "1.5.6"
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: terraform-latest
            version: latest
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: tofu-1.11
            version: "1.11"
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
          - name: tofu-latest
            version: latest
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
        example:
          [
            "default",
            "prebuilt",
            "ephemeral",
            "termination-watcher",
            "multi-runner",
            "multi-runner-v2",
            "external-managed-ssm-secrets"
          ]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: Select ${{ matrix.iac.name }} lockfile
        if: matrix.iac.command == 'tofu'
        env:
          IAC_LOCK_FILE: ${{ matrix.iac.lockfile }}
        run: cp "$IAC_LOCK_FILE" .terraform.lock.hcl

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false -lockfile=readonly

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: $IAC_COMMAND validate

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        working-directory: ${{ github.workspace }}
        env:
          EXAMPLE_NAME: ${{ matrix.example }}
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl --chdir "examples/${EXAMPLE_NAME}"
          tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "examples/${EXAMPLE_NAME}"

  terraform_test:
    name: Terraform test
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/runners
          - modules/multi-runner
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14"
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform test
        run: terraform test -test-directory=tests
