name: "Terraform checks"

on:
  push:
    branches:
      - main
  pull_request:
    paths: ["**/*.tf", "**/*.hcl", ".github/workflows/terraform.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  verify_modules:
    name: Verify modules (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        iac:
          - name: terraform
            version: "1.5.6"
            command: terraform
          - name: terraform-latest
            version: latest
            command: terraform
          - name: tofu
            version: "1.11"
            command: tofu
          - name: tofu-latest
            version: latest
            command: tofu

    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-verify_modules-${{ github.run_id }}
          restore-keys: |
            iac-providers-verify_modules-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: Fake zip files
        run: |
          touch lambdas/functions/webhook/webhook.zip
          touch lambdas/functions/control-plane/runners.zip
          touch lambdas/functions/gh-agent-syncer/runner-binaries-syncer.zip
          touch lambdas/functions/ami-housekeeper/ami-housekeeper.zip
          touch lambdas/functions/termination-watcher/termination-watcher.zip

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: Discover Terraform modules
        shell: bash
        run: |
          modules="$(
            {
              printf '.\n'
              find modules \
                \( -type d \( -name .git -o -name .terraform -o -name tests \) -prune \) -o \
                \( -type f -name '*.tf' -print \) |
              while IFS= read -r tf_file; do
                dirname "${tf_file}"
              done
            } | sort -u
          )"

          if [ -z "${modules}" ]; then
            echo "::error::No Terraform modules found"
            exit 1
          fi

          {
            printf 'MODULES<<EOF\n'
            printf '%s\n' "${modules}"
            printf 'EOF\n'
          } >> "${GITHUB_ENV}"

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Running $IAC_COMMAND init for module: ${module}"
            $IAC_COMMAND -chdir="${module}" init -get -backend=false -input=false
            echo "::endgroup::"
          done

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Checking $IAC_COMMAND formatting for module: ${module}"
            $IAC_COMMAND -chdir="${module}" fmt -recursive -check=true -write=false
            echo "::endgroup::"
          done
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Validating module: ${module}"
            $IAC_COMMAND -chdir="${module}" validate
            echo "::endgroup::"
          done

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl

          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Running TFLint for module: ${module}"
            tflint -f compact \
              -c ${GITHUB_WORKSPACE}/.tflint.hcl \
              --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars \
              --chdir "${module}"
            echo "::endgroup::"
          done

  verify_examples:
    name: Verify examples (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        iac:
          - name: terraform
            version: "1.5.6"
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: terraform-latest
            version: latest
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: tofu
            version: "1.11"
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
          - name: tofu-latest
            version: latest
            command: tofu
            lockfile: .terraform.lock.hcl.tofu

    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-verify_examples-${{ github.run_id }}
          restore-keys: |
            iac-providers-verify_examples-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: Discover examples
        shell: bash
        run: |
          examples="$(
            find examples \
              \( -type d \( -name .git -o -name .terraform \) -prune \) -o \
              \( -type f -name '*.tf' -print \) |
            while IFS= read -r tf_file; do
              dirname "${tf_file}"
            done |
            sed 's#^examples/##' |
            sort -u
          )"

          if [ -z "${examples}" ]; then
            echo "::error::No Terraform examples found"
            exit 1
          fi

          {
            printf 'EXAMPLES<<EOF\n'
            printf '%s\n' "${examples}"
            printf 'EOF\n'
          } >> "${GITHUB_ENV}"

      - name: Select ${{ matrix.iac.name }} lockfile
        if: matrix.iac.command == 'tofu'
        env:
          IAC_LOCK_FILE: ${{ matrix.iac.lockfile }}
        run: |
          while IFS= read -r example; do
            [ -z "${example}" ] && continue

            echo "::group::Selecting lockfile for example: ${example}"
            cp "examples/${example}/${IAC_LOCK_FILE}" \
              "examples/${example}/.terraform.lock.hcl"
            echo "::endgroup::"
          done <<< "${EXAMPLES}"

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          while IFS= read -r example; do
            [ -z "${example}" ] && continue

            echo "::group::Running $IAC_COMMAND init for example: ${example}"
            $IAC_COMMAND -chdir="examples/${example}" init \
              -get -backend=false -input=false -lockfile=readonly
            echo "::endgroup::"
          done <<< "${EXAMPLES}"

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          while IFS= read -r example; do
            [ -z "${example}" ] && continue

            echo "::group::Checking $IAC_COMMAND formatting for example: ${example}"
            $IAC_COMMAND -chdir="examples/${example}" fmt \
              -recursive -check=true -write=false
            echo "::endgroup::"
          done <<< "${EXAMPLES}"
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          while IFS= read -r example; do
            [ -z "${example}" ] && continue

            echo "::group::Validating example: ${example}"
            $IAC_COMMAND -chdir="examples/${example}" validate
            echo "::endgroup::"
          done <<< "${EXAMPLES}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl

          while IFS= read -r example; do
            [ -z "${example}" ] && continue

            echo "::group::Running TFLint for example: ${example}"
            tflint -f compact \
              -c ${GITHUB_WORKSPACE}/.tflint.hcl \
              --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars \
              --chdir "examples/${example}"
            echo "::endgroup::"
          done <<< "${EXAMPLES}"

  terraform_test:
    name: ${{ matrix.iac.name }} test
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        iac:
          - name: terraform
            version: latest
            command: terraform
          - name: tofu
            version: latest
            command: tofu

    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-terraform_test-${{ github.run_id }}
          restore-keys: |
            iac-providers-terraform_test-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: Discover Terraform test modules
        shell: bash
        run: |
          test_modules="$(
            find . \
              \( -type d \( -name .git -o -name .terraform \) -prune \) -o \
              \( -type f -name '*.tftest.hcl' -print \) |
            while IFS= read -r test_file; do
              test_dir=$(dirname "${test_file}")
              printf '%s\n' "${test_dir%/tests}"
            done |
            sort -u
          )"

          if [ -z "${test_modules}" ]; then
            echo "::error::No Terraform test modules found"
            exit 1
          fi

          {
            printf 'TEST_MODULES<<EOF\n'
            printf '%s\n' "${test_modules}"
            printf 'EOF\n'
          } >> "${GITHUB_ENV}"

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Running $IAC_COMMAND init for test module: ${module}"
            $IAC_COMMAND -chdir="${module}" init \
              -backend=false -input=false
            echo "::endgroup::"
          done <<< "${TEST_MODULES}"

      - name: ${{ matrix.iac.name }} test
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          while IFS= read -r module; do
            [ -z "${module}" ] && continue

            echo "::group::Running $IAC_COMMAND test for module: ${module}"
            $IAC_COMMAND -chdir="${module}" test -test-directory=tests -compact-warnings
            echo "::endgroup::"
          done <<< "${TEST_MODULES}"
