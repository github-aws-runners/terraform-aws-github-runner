name: "Terraform checks"
on:
  push:
    branches:
      - main
  pull_request:
    paths: ["**/*.tf", "**/*.hcl", ".github/workflows/terraform.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  MODULES: |
    .
    modules/ami-housekeeper
    modules/compute-providers/aws/ec2
    modules/compute-providers/aws/ec2/trust-policy
    modules/download-lambda
    modules/lambda
    modules/multi-runner
    modules/orchestration-providers/webhook
    modules/orchestration-providers/webhook/job-retry
    modules/orchestration-providers/webhook/pool
    modules/orchestration-providers/webhook/scale-runners
    modules/runner-binaries-syncer
    modules/runner-config
    modules/runner-config/ssm-housekeeper
    modules/runners
    modules/runners/job-retry
    modules/runners/pool
    modules/setup-iam-permissions
    modules/storage-providers/aws/ssm
    modules/termination-watcher
    modules/termination-watcher/notification
    modules/termination-watcher/termination
    modules/webhook
    modules/webhook/direct
    modules/webhook/eventbridge
    modules/webhook-github-app
  EXAMPLES: |
    default
    prebuilt
    ephemeral
    termination-watcher
    multi-runner
    multi-runner-v2
    external-managed-ssm-secrets
  TEST_MODULES: |
    modules/runners
    modules/multi-runner
jobs:
  verify_modules:
    name: Verify modules (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform
            version: "1.5.6"
            command: terraform
          - name: terraform-latest
            version: latest
            command: terraform
          - name: tofu
            version: "1.11"
            command: tofu
          - name: tofu-latest
            version: latest
            command: tofu
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-verify_modules-${{ github.run_id }}
          restore-keys: |
            iac-providers-verify_modules-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: "Fake zip files" # Validate will fail if it cannot find the zip files
        run: |
          touch lambdas/functions/webhook/webhook.zip
          touch lambdas/functions/control-plane/runners.zip
          touch lambdas/functions/gh-agent-syncer/runner-binaries-syncer.zip
          touch lambdas/functions/ami-housekeeper/ami-housekeeper.zip
          touch lambdas/functions/termination-watcher/termination-watcher.zip

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            $IAC_COMMAND -chdir="${module}" init -get -backend=false -input=false
          done

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            $IAC_COMMAND -chdir="${module}" fmt -recursive -check=true -write=false
          done
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            $IAC_COMMAND -chdir="${module}" validate
          done

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl
          printf '%s\n' "${MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "${module}"
          done

  verify_examples:
    name: Verify examples (${{ matrix.iac.name }} ${{ matrix.iac.version }})
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform
            version: "1.5.6"
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: terraform-latest
            version: latest
            command: terraform
            lockfile: .terraform.lock.hcl
          - name: tofu
            version: "1.11"
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
          - name: tofu-latest
            version: latest
            command: tofu
            lockfile: .terraform.lock.hcl.tofu
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-verify_examples-${{ github.run_id }}
          restore-keys: |
            iac-providers-verify_examples-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: Select ${{ matrix.iac.name }} lockfile
        if: matrix.iac.command == 'tofu'
        env:
          IAC_LOCK_FILE: ${{ matrix.iac.lockfile }}
        run: |
          printf '%s\n' "${EXAMPLES}" | while IFS= read -r example; do
            [ -z "${example}" ] && continue
            cp "examples/${example}/${IAC_LOCK_FILE}" "examples/${example}/.terraform.lock.hcl"
          done

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${EXAMPLES}" | while IFS= read -r example; do
            [ -z "${example}" ] && continue
            $IAC_COMMAND -chdir="examples/${example}" init -get -backend=false -input=false -lockfile=readonly
          done

      - name: Check ${{ matrix.iac.name }} formatting
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${EXAMPLES}" | while IFS= read -r example; do
            [ -z "${example}" ] && continue
            $IAC_COMMAND -chdir="examples/${example}" fmt -recursive -check=true -write=false
          done
        continue-on-error: ${{ matrix.iac.version == 'latest' }}

      - name: Validate ${{ matrix.iac.name }}
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${EXAMPLES}" | while IFS= read -r example; do
            [ -z "${example}" ] && continue
            $IAC_COMMAND -chdir="examples/${example}" validate
          done

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl
          printf '%s\n' "${EXAMPLES}" | while IFS= read -r example; do
            [ -z "${example}" ] && continue
            tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "examples/${example}"
          done

  terraform_test:
    name: ${{ matrix.iac.name }} test
    strategy:
      fail-fast: false
      matrix:
        iac:
          - name: terraform
            version: latest
            command: terraform
          - name: tofu
            version: latest
            command: tofu
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache IAC providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin
          key: iac-providers-terraform_test-${{ github.run_id }}
          restore-keys: |
            iac-providers-terraform_test-

      - name: Set Terraform plugin cache
        run: |
          mkdir -p "$HOME/.terraform.d/plugin"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin" >> "$GITHUB_ENV"

      - name: Setup Terraform
        if: matrix.iac.command == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.iac.version }}
          terraform_wrapper: false

      - name: Setup OpenTofu
        if: matrix.iac.command == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.iac.version }}
          tofu_wrapper: false

      - name: ${{ matrix.iac.name }} init
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${TEST_MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            $IAC_COMMAND -chdir="${module}" init -backend=false -input=false
          done

      - name: ${{ matrix.iac.name }} test
        env:
          IAC_COMMAND: ${{ matrix.iac.command }}
        run: |
          printf '%s\n' "${TEST_MODULES}" | while IFS= read -r module; do
            [ -z "${module}" ] && continue
            $IAC_COMMAND -chdir="${module}" test -test-directory=tests
          done
