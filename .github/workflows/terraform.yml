name: "Terraform checks"
on:
  push:
    branches:
      - main
  pull_request:
    paths: ["**/*.tf", "**/*.hcl", ".github/workflows/terraform.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
jobs:
  verify_module:
    name: Verify module (${{ matrix.iac }} ${{ matrix.version }})
    strategy:
      matrix:
        include:
          - iac: terraform
            version: "1.5.6"
            image: "hashicorp/terraform:1.5.6"
            command: terraform
          - iac: terraform
            version: latest
            image: "hashicorp/terraform:latest"
            command: terraform
          - iac: tofu
            version: "1.11"
            image: "ghcr.io/opentofu/opentofu:1.11"
            command: tofu
          - iac: tofu
            version: latest
            image: "ghcr.io/opentofu/opentofu:latest"
            command: tofu
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Fake zip files" # Validate will fail if it cannot find the zip files
        run: |
          touch lambdas/functions/webhook/webhook.zip
          touch lambdas/functions/control-plane/runners.zip
          touch lambdas/functions/gh-agent-syncer/runner-binaries-syncer.zip
          touch lambdas/functions/ami-housekeeper/ami-housekeeper.zip
          touch lambdas/functions/termination-watcher/termination-watcher.zip
      - name: ${{ matrix.iac }} init
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false
      - name: Check ${{ matrix.iac }} formatting
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.version == 'latest' }}
      - name: Validate ${{ matrix.iac }}
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND validate
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Fix for actions/cache on alpine
        run: apk add --no-cache tar
        continue-on-error: true
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Run TFLint
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl
          tflint -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars

  verify_modules:
    name: Verify modules (${{ matrix.iac }} ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - iac: terraform
            version: "1.5.6"
            image: "hashicorp/terraform:1.5.6"
            command: terraform
          - iac: terraform
            version: latest
            image: "hashicorp/terraform:latest"
            command: terraform
          - iac: tofu
            version: "1.11"
            image: "ghcr.io/opentofu/opentofu:1.11"
            command: tofu
          - iac: tofu
            version: latest
            image: "ghcr.io/opentofu/opentofu:latest"
            command: tofu
        module:
          [
            "ami-housekeeper",
            "download-lambda",
            "lambda",
            "multi-runner",
            "runner-binaries-syncer",
            "runners",
            "setup-iam-permissions",
            "ssm",
            "termination-watcher",
            "webhook",
          ]
    defaults:
      run:
        working-directory: modules/${{ matrix.module }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ${{ matrix.iac }} init
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false
      - name: Check ${{ matrix.iac }} formatting
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.version == 'latest' }}
      - name: Validate ${{ matrix.iac }}
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND validate
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.3.')
        name: Fix for actions/cache on alpine
        run: apk add --no-cache tar
        continue-on-error: true
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.3.')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.3.')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.3.')
        name: Run TFLint
        working-directory: ${{ github.workspace }}
        env:
          MODULE_NAME: ${{ matrix.module }}
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl --chdir "modules/${MODULE_NAME}"
          tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "modules/${MODULE_NAME}"

  verify_examples:
    name: Verify examples (${{ matrix.iac }} ${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - iac: terraform
            version: "1.5.6"
            image: "hashicorp/terraform:1.5.6"
            command: terraform
          - iac: terraform
            version: latest
            image: "hashicorp/terraform:latest"
            command: terraform
          - iac: tofu
            version: "1.11"
            image: "ghcr.io/opentofu/opentofu:1.11"
            command: tofu
          - iac: tofu
            version: latest
            image: "ghcr.io/opentofu/opentofu:latest"
            command: tofu
        example:
          [
            "default",
            "prebuilt",
            "ephemeral",
            "termination-watcher",
            "multi-runner",
            "multi-runner-v2",
            "external-managed-ssm-secrets"
          ]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ${{ matrix.iac }} init
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND init -get -backend=false -input=false
      - name: Check ${{ matrix.iac }} formatting
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND fmt -recursive -check=true -write=false
        continue-on-error: ${{ matrix.version == 'latest' }}
      - name: Validate ${{ matrix.iac }}
        env:
          IAC_COMMAND: ${{ matrix.command }}
        run: $IAC_COMMAND validate
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Fix for actions/cache on alpine
        run: apk add --no-cache tar
        continue-on-error: true
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache TFLint plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.iac == 'terraform' && contains(matrix.version, '1.5.')
        name: Run TFLint
        working-directory: ${{ github.workspace }}
        env:
          EXAMPLE_NAME: ${{ matrix.example }}
        run: |
          tflint --init -c ${GITHUB_WORKSPACE}/.tflint.hcl --chdir "examples/${EXAMPLE_NAME}"
          tflint -f compact -c ${GITHUB_WORKSPACE}/.tflint.hcl --var-file ${GITHUB_WORKSPACE}/.github/lint/tflint.tfvars --chdir "examples/${EXAMPLE_NAME}"

  terraform_test:
    name: Terraform test
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/runners
          - modules/multi-runner
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform@sha256:1d10ec4073f4ddbdf34a28540a3b9250852ab500cb1c53f68c8bd17d82f474d8 # 1.14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform test
        run: terraform test -test-directory=tests
